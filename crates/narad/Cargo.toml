[package]
name = "narad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
narad-core = { path = "../narad-core" }
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
clap = { version = "=4.5.23", features = ["derive"] }
mdns-sd = "=0.11.5"
fs2 = "=0.4.3"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.3", features = ["full"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "=0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Shutdown"] }
