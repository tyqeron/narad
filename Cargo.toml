[workspace]
members = ["crates/narad-core", "crates/narad", "crates/narad-android"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
blake3 = "=1.5.5"
chacha20poly1305 = "=0.10.1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
rand = "=0.8.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.14.0"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
