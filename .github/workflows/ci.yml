name: Narad checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: python3 tests/e2e.py
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libpulse-dev libasound2-dev xvfb xdotool dbus-x11
      - run: flutter pub get
        working-directory: clients/flutter
      - run: dart format --output=none --set-exit-if-changed lib test tools integration_test
        working-directory: clients/flutter
      - run: flutter analyze
        working-directory: clients/flutter
      - run: flutter test
        working-directory: clients/flutter
      - run: ./scripts/build-linux-installer.sh debug
      - run: python3 tests/linux_packaging.py dist/narad-linux-x64-debug.run
      - run: xvfb-run -a dbus-run-session -- python3 tests/linux_background.py clients/flutter/build/linux/x64/debug/bundle

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: ./scripts/build-android.sh
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: clients/flutter/android
      - uses: actions/upload-artifact@v4
        with:
          name: narad-android-development
          path: |
            dist/narad-android-release.apk
            dist/narad-android-release.apk.sha256

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --locked -p narad
      - run: python tests/windows_e2e.py
      - run: flutter pub get
        working-directory: clients/flutter
      - run: flutter analyze
        working-directory: clients/flutter
      - run: flutter test
        working-directory: clients/flutter
      - name: Parse Windows packaging scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*windows*.ps1 | ForEach-Object {
            $ParseErrors = $null
            $Tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors) | Out-Null
            if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          }
      - run: ./scripts/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: narad-windows-x64-development
          path: |
            dist/narad-windows-x64-release.zip
            dist/narad-windows-x64-release.zip.sha256

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: ./scripts/build-ios.sh --simulator
