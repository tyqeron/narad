name: Narad checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: python3 tests/e2e.py
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libpulse-dev libasound2-dev
      - run: flutter pub get
        working-directory: clients/flutter
      - run: dart format --output=none --set-exit-if-changed lib test tools
        working-directory: clients/flutter
      - run: flutter analyze
        working-directory: clients/flutter
      - run: flutter test
        working-directory: clients/flutter
      - run: flutter build linux --debug
        working-directory: clients/flutter
